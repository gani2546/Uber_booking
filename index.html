<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Uber Booking — Black & White</title>

  <!-- Fonts and Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: #000;
      color: #fff;
      padding: 0 1rem;
    }

    h1 {
      text-align: center;
      background-color: #111;
      padding: 1.5rem 1rem;
      font-size: 2.4rem;
      letter-spacing: 1px;
      margin-bottom: 2rem;
    }

    .container {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 2rem;
      max-width: 1200px;
      margin: auto;
      animation: fadeIn 1s ease-in-out;
    }

    .booking-box {
      background: #111;
      border: 1px solid #333;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(255, 255, 255, 0.1);
      width: 100%;
      max-width: 400px;
      padding: 2rem;
      transition: all 0.3s ease;
    }

    .booking-box:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 28px rgba(255, 255, 255, 0.2);
    }

    .booking-box img {
      width: 100%;
      border-radius: 12px;
      margin-bottom: 1rem;
      object-fit: cover;
      height: 180px;
      filter: grayscale(100%);
    }

    .title {
      text-align: center;
      font-size: 1.5rem;
      margin-bottom: 1rem;
      font-weight: 600;
    }

    label {
      display: block;
      margin-top: 1rem;
      font-weight: 600;
      color: #ccc;
      font-size: 0.95rem;
    }

    .input-group {
      position: relative;
    }

    .input-group i {
      position: absolute;
      top: 50%;
      left: 12px;
      transform: translateY(-50%);
      color: #aaa;
    }

    .input-group input,
    .input-group select {
      width: 100%;
      padding: 0.75rem 0.75rem 0.75rem 2.5rem;
      margin-top: 0.5rem;
      border: 1px solid #555;
      border-radius: 8px;
      font-size: 1rem;
      background-color: #fff;
      color: #000;
    }

    .input-group input:focus,
    .input-group select:focus {
      border-color: #fff;
      outline: none;
    }

    input[type="submit"],
    .submit-btn {
      margin-top: 1.5rem;
      background-color: #fff;
      color: #000;
      font-weight: bold;
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.3s ease, transform 0.2s ease;
    }

    input[type="submit"]:hover,
    .submit-btn:hover {
      background-color: #000;
      color: #fff;
      border: 1px solid #fff;
      transform: translateY(-2px);
    }

    @keyframes fadeIn {
      0% {
        opacity: 0;
        transform: translateY(30px);
      }

      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 2rem;
        padding: 1rem;
      }

      .booking-box {
        padding: 1.5rem;
        max-width: 90%;
      }
    }

    @media (max-width: 480px) {
      .container {
        flex-direction: column;
        align-items: center;
      }

      .title {
        font-size: 1.3rem;
      }

      input,
      select {
        font-size: 0.95rem;
        padding: 0.65rem 0.65rem 0.65rem 2.2rem;
      }
    }
  </style>
</head>

<body>
  <h1>Uber Booking — Black & White</h1>
  <div class="container">

    <!-- Car Booking -->
    <div class="booking-box">
      <div class="title">Car Booking</div>
      <img src="car.jpg" alt="Car Image" />
      <form onsubmit="return validateForm(this)">
        <label for="car-city">Select City:</label>
        <div class="input-group">
          <i class="fas fa-city"></i>
          <select id="car-city" required>
            <option value="">— Select City —</option>
            <option value="Aurangabad">Aurangabad</option>
            <option value="Hyderabad">Hyderabad</option>
            <option value="Mumbai">Mumbai</option>
          </select>
        </div>

        <label for="car-name">Your Name:</label>
        <div class="input-group">
          <i class="fas fa-user"></i>
          <input type="text" id="car-name" placeholder="Enter your name" required />
        </div>

        <label for="car-pickup">Pickup Location:</label>
        <div class="input-group">
          <i class="fas fa-location-dot"></i>
          <input type="text" id="car-pickup" placeholder="Enter pickup location" required />
        </div>

        <label for="car-drop">Drop Location:</label>
        <div class="input-group">
          <i class="fas fa-location-arrow"></i>
          <input type="text" id="car-drop" placeholder="Enter drop location" required />
        </div>

        <input type="submit" class="submit-btn" value="Book Car" />
      </form>
    </div>

    <!-- Bike Booking -->
    <div class="booking-box">
      <div class="title">Bike Booking</div>
      <img src="bike.jpg" alt="Bike Image" />
      <form onsubmit="return validateForm(this)">
        <label for="bike-city">Select City:</label>
        <div class="input-group">
          <i class="fas fa-city"></i>
          <select id="bike-city" required>
            <option value="">— Select City —</option>
            <option value="Aurangabad">Aurangabad</option>
            <option value="Hyderabad">Hyderabad</option>
            <option value="Mumbai">Mumbai</option>
          </select>
        </div>

        <label for="bike-name">Your Name:</label>
        <div class="input-group">
          <i class="fas fa-user"></i>
          <input type="text" id="bike-name" placeholder="Enter your name" required />
        </div>

        <label for="bike-pickup">Pickup Location:</label>
        <div class="input-group">
          <i class="fas fa-location-dot"></i>
          <input type="text" id="bike-pickup" placeholder="Enter pickup location" required />
        </div>

        <label for="bike-drop">Drop Location:</label>
        <div class="input-group">
          <i class="fas fa-location-arrow"></i>
          <input type="text" id="bike-drop" placeholder="Enter drop location" required />
        </div>

        <input type="submit" class="submit-btn" value="Book Bike" />
      </form>
    </div>
  </div>

  <!-- JavaScript for form validation -->
  <script>
    function validateForm(form) {
      const inputs = form.querySelectorAll("input, select");
      for (let input of inputs) {
        input.classList.remove("error-shake");
        if (!input.value) {
          input.classList.add("error-shake");
          input.focus();
          return false;
        }
      }
      alert("Booking successful!");
      return true;
    }
  </script>
</body>

</html>
