<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Uber Booking</title>

  <!-- Font Awesome -->
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #fff;
      color: #000;
    }

    header {
      background: #000;
      color: #fff;
      padding: 1.5rem 0;
      text-align: center;
      font-size: 1.8rem;
      letter-spacing: 1px;
    }

    .container {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 2rem;
      padding: 3rem 1rem;
    }

    .booking-box {
      background: #fff;
      border: 1.5px solid #000;
      border-radius: 16px;
      width: 360px;
      padding: 2rem;
      box-shadow: 4px 6px 0 #000;
      transition: all 0.3s ease-in-out;
    }

    .booking-box:hover {
      box-shadow: none;
      transform: translate(2px, 2px);
    }

    .icon {
      font-size: 3rem;
      margin-bottom: 0.5rem;
      color: #000;
    }

    .booking-box h2 {
      font-size: 1.4rem;
      margin-bottom: 1.2rem;
      font-weight: 600;
    }

    .booking-box input,
    .booking-box select,
    .booking-box button {
      width: 100%;
      padding: 0.8rem;
      margin: 0.6rem 0;
      font-size: 1rem;
      border: 1px solid #000;
      border-radius: 8px;
      background: #fff;
      color: #000;
      transition: all 0.2s ease-in-out;
    }

    .booking-box input:focus,
    .booking-box select:focus {
      outline: none;
      border-color: #333;
      background: #f9f9f9;
    }

    .booking-box button {
      background: #000;
      color: #fff;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }

    .booking-box button:hover {
      background: #333;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #000;
      color: #fff;
      padding: 1rem 1.5rem;
      border-radius: 8px;
      box-shadow: 0 5px 10px rgba(0,0,0,0.3);
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.4s ease, transform 0.4s ease;
      z-index: 999;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* Spinner Overlay */
    .spinner-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.6);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .spinner {
      border: 6px solid #fff;
      border-top: 6px solid #000;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 768px) {
      .container {
        flex-direction: column;
        align-items: center;
        padding: 2rem 1rem;
      }
    }
  </style>
</head>
<body>

  <header>
    Uber Booking
  </header>

  <div class="container">

    <!-- Car Booking -->
    <form class="booking-box" onsubmit="handleBooking(event, 'Car')">
      <div class="icon"><i class="fas fa-car"></i></div>
      <h2>Book a Car</h2>
      <input type="text" placeholder="Pickup Location" required />
      <input type="text" placeholder="Drop Location" required />
      <input type="date" required />
      <input type="time" required />
      <select required>
        <option value="">Choose Car Type</option>
        <option>Mini</option>
        <option>Sedan</option>
        <option>SUV</option>
      </select>
      <button type="submit">Book Car</button>
    </form>

    <!-- Bike Booking -->
    <form class="booking-box" onsubmit="handleBooking(event, 'Bike')">
      <div class="icon"><i class="fas fa-motorcycle"></i></div>
      <h2>Book a Bike</h2>
      <input type="text" placeholder="Pickup Location" required />
      <input type="text" placeholder="Drop Location" required />
      <input type="date" required />
      <input type="time" required />
      <select required>
        <option value="">Choose Bike Type</option>
        <option>Standard</option>
        <option>Scooter</option>
        <option>Electric</option>
      </select>
      <button type="submit">Book Bike</button>
    </form>

  </div>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

  <!-- Spinner -->
  <div id="spinner" class="spinner-overlay">
    <div class="spinner"></div>
  </div>

  <script>
    function handleBooking(event, type) {
      event.preventDefault();

      const spinner = document.getElementById('spinner');
      spinner.style.display = 'flex';

      setTimeout(() => {
        spinner.style.display = 'none';

        const toast = document.getElementById('toast');
        toast.textContent = `${type} booking confirmed!`;
        toast.classList.add('show');

        setTimeout(() => {
          toast.classList.remove('show');
        }, 3000);
      }, 2000);
    }
  </script>

</body>
</html>
